<div class="max-w-7xl mx-auto p-5 sm:p-6">
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-[#4a3f18] mb-4 sm:mb-0">Chifles Artesanales</h1>
    <label for="searchProduct" class="sr-only">Buscar productos</label>
    <input type="text" id="searchProduct" placeholder="Buscar sabor..." class="p-2 w-full sm:w-64 rounded-md border border-gray-400 text-base transition-colors duration-300 focus:border-[#d4a73a] focus:outline-none" />
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 sm:gap-6">
    @for (producto of productos; track $index) {
    <div class="bg-[#fffdf7] border border-[#f2eac7] rounded-xl p-4 text-center transition-transform duration-200 shadow-md cursor-pointer hover:scale-[1.01] hover:shadow-xl hover:shadow-gray-300">
      <img [src]="producto.imagen || 'https://via.placeholder.com/300?text=Sin+Imagen'" 
           [alt]="producto.nombre" 
           class="w-full h-48 object-cover rounded-lg" />
      <h3 class="text-lg text-[#3b3113] font-semibold mt-3 mb-1">{{ producto.nombre }}</h3>
      <p class="text-sm text-[#6b644b] mb-3">{{ producto.descripcion }}</p>
      <span class="block font-bold text-xl text-[#d4a73a] mb-3">S/ {{ producto.precio.toFixed(2) }}</span>
      <button type="button" (click)="agregar(producto)" class="bg-[#d4a73a] text-white border-none p-3 w-full text-base rounded-md cursor-pointer transition-colors duration-300 hover:bg-[#b98d2d]">Agregar al carrito</button>
    </div>
    }
  </div>
</div>
