<div class="productos-container">
  <div class="header">
    <h1>Chifles Artesanales</h1>
    <input type="text" placeholder="Buscar sabor..." />
  </div>

  <div class="productos-grid">
    @for (producto of productos; track $index) {
    <div class="producto-card">
      <img [src]="producto.imagen" [alt]="producto.nombre" />
      <h3>{{ producto.nombre }}</h3>
      <p class="description">{{ producto.descripcion }}</p>
      <span class="price">S/ {{ producto.precio.toFixed(2) }}</span>
      <button (click)="agregar(producto)">Agregar al carrito</button>
    </div>
    }
  </div>
</div>
