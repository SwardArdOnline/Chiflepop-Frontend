<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo" (click)="goToHome()">
        <span class="logo-icon">🍌</span>
        <span class="logo-text">ChiflePop</span>
      </div>
      <h1 class="auth-title">Crea tu cuenta</h1>
      <p class="auth-subtitle">Únete a la comunidad de ChiflePop</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name" class="form-label">Nombre Completo</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          class="form-input"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="form-input"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
        <div class="password-input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            class="form-input"
            placeholder="••••••••"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPassword()"
          >
            {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <div class="form-footer">
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms">
          <span>Acepto los <a href="#" class="terms-link">términos y condiciones</a></span>
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Crear Cuenta</span>
        <span *ngIf="isLoading" class="loading-spinner">Cargando...</span>
      </button>
    </form>

    <div class="auth-divider">
      <span>o</span>
    </div>

    <p class="auth-switch">
      ¿Ya tienes cuenta?
      <button type="button" class="link-button" (click)="goToLogin()">
        Inicia sesión aquí
      </button>
    </p>
  </div>

  <div class="auth-background">
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>
    <div class="background-shape shape-3"></div>
  </div>
</div>
