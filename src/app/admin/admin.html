<div class="flex min-h-screen bg-gray-100">
  <aside class="w-64 bg-[var(--color-primary-dark,#2E7D32)] text-white flex flex-col shadow-xl">
    <div class="p-6 text-center border-b border-[var(--color-primary-darker,#1B5E20)]/30">
      <span class="text-4xl">🛡️</span>
      <h2 class="mt-2 text-xl font-bold tracking-wider">Admin Panel</h2>
    </div>

    <nav class="flex-1 p-4 space-y-2" aria-label="Menú de administración">
      <a routerLink="/admin/products" routerLinkActive="bg-white/20 font-bold" class="block p-3 rounded-lg hover:bg-white/10 transition flex items-center gap-3">
        <span>🍌</span> Productos
      </a>
      <a routerLink="/admin/employees" routerLinkActive="bg-white/20 font-bold" class="block p-3 rounded-lg hover:bg-white/10 transition flex items-center gap-3">
        <span>👔</span> Empleados
      </a>
      <a routerLink="/admin/customers" routerLinkActive="bg-white/20 font-bold" class="block p-3 rounded-lg hover:bg-white/10 transition flex items-center gap-3">
        <span>👥</span> Clientes
      </a>
    </nav>

    <div class="p-4 border-t border-[var(--color-primary-darker,#1B5E20)]/30">
      <button type="button" (click)="logout()" class="w-full p-3 text-center bg-red-600 hover:bg-red-700 rounded-lg transition font-bold">
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
