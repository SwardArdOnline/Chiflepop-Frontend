<div class="cart-container">
  <h2><span aria-hidden="true">🛒</span> Tu Carrito</h2>
  @if (carrito.length === 0) {
  <div class="empty">No hay productos aún.</div>
  } @for (item of carrito; track $index) {
  <div class="cart-item">
    <div>
      <h3>{{ item.nombre }}</h3>
      <p>Cantidad: {{ item.cantidad }}</p>
      <p>Subtotal: S/ {{ (item.precio * item.cantidad).toFixed(2) }}</p>
    </div>

    <button type="button" class="remove" (click)="eliminar(item.id)">Eliminar</button>
  </div>
  } @if (carrito.length > 0){
  <div class="cart-footer">
    <h3>Total: S/ {{ total.toFixed(2) }}</h3>
    <button type="button" class="clear" (click)="vaciar()">Vaciar carrito</button>
    <button type="button" class="checkout">Pagar</button>
  </div>
  }
</div>
